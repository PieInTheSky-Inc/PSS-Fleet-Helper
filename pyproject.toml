[project]
name = "pss-fleet-helper"
version = "0.11.0"
description = "A bot assisting in Discord management."
authors = [{ name = "The worst.", email = "theworstpss@gmail.com" }]
dependencies = [
    "psycopg2-binary>=2.9.9",
    "py-cord>=2.5.0",
    "pssapi>=0.7.0",
    "emoji>=2.12.1",
    "sqlalchemy==1.4.47",
    "asyncpg==0.27.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "pytest>=7.2.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "pytest-vcr>=1.0.2",
    "ruff>=0.15.21",
    "vcrpy>=6.0.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pss_fleet_helper"]

[tool.ruff]
target-version = "py311"
line-length = 200
src = ["src"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore-init-module-imports = true

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.vulture]
min_confidence = 100
paths = ["./src/pssapi"]
sort_by_size = true
